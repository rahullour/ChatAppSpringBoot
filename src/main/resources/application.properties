spring.application.name=wechat

#aws db config
#spring.datasource.url=jdbc:mysql://database-1.czk42yog8v5o.ap-south-1.rds.amazonaws.com:3306/students_tracker
spring.profiles.active=dev

#logging config
spring.main.banner-mode=off
#spring.jpa.hibernate.dll-auto=update
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.jdbc.core=trace
logging.level.org.springframework.security=DEBUG
logging.level.com.creating.chatApplication=DEBUG

# ==========================================
# Server & Session Settings
# ==========================================
server.servlet.session.timeout=90m

# ==========================================
# Optimized Hikari Pool for Render Free Tier
# ==========================================
# Keeping it tight saves RAM and prevents database connection exhaustion
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# File Uploads
# ==========================================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ==========================================
# Optimized Actuator Config for Quick Startup
# ==========================================
management.endpoints.web.exposure.include=health,info
# 'when-authorized' or 'never' prevents Actuator from pinging the DB during startup health checks
management.endpoint.health.show-details=never
management.info.env.enabled=false

